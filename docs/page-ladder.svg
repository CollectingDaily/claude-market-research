<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250"><rect x="0.5" y="0.5" width="979" height="249" rx="14" fill="#ffffff" stroke="#e2e0d8"/><text x="490.0" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="490.0" dy="0">How Claude opens a page</tspan></text><rect x="35.0" y="72" width="208" height="150" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="65.0" cy="104" r="16" fill="#f2c14e"/><text x="65.0" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="65.0" dy="0">1</tspan></text><text x="91.0" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="91.0" dy="0">Plain read</tspan></text><text x="55.0" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="55.0" dy="0">Most pages open</tspan><tspan x="55.0" dy="18.9">straight away, with</tspan><tspan x="55.0" dy="18.9">nothing asked of you.</tspan></text><line x1="246.0" y1="147" x2="257.0" y2="147" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M254.0,139 L266.0,147 L254.0,155 Z" fill="#8fd1d5"/><rect x="269.0" y="72" width="208" height="150" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="299.0" cy="104" r="16" fill="#323748"/><text x="299.0" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="299.0" dy="0">2</tspan></text><text x="325.0" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="325.0" dy="0">Your Chrome</tspan></text><text x="289.0" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="289.0" dy="0">Locked pages open in</tspan><tspan x="289.0" dy="18.9">your Chrome, where</tspan><tspan x="289.0" dy="18.9">you are signed in.</tspan></text><line x1="480.0" y1="147" x2="491.0" y2="147" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M488.0,139 L500.0,147 L488.0,155 Z" fill="#8fd1d5"/><rect x="503.0" y="72" width="208" height="150" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="533.0" cy="104" r="16" fill="#323748"/><text x="533.0" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="533.0" dy="0">3</tspan></text><text x="559.0" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="559.0" dy="0">Claude asks you</tspan></text><text x="523.0" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="523.0" dy="0">A login has lapsed or a</tspan><tspan x="523.0" dy="18.9">&quot;verify you&#x27;re human&quot;</tspan><tspan x="523.0" dy="18.9">check: you clear it.</tspan></text><line x1="714.0" y1="147" x2="725.0" y2="147" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M722.0,139 L734.0,147 L722.0,155 Z" fill="#8fd1d5"/><rect x="737.0" y="72" width="208" height="150" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="767.0" cy="104" r="16" fill="#2e8b57"/><text x="767.0" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="767.0" dy="0">4</tspan></text><text x="793.0" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="793.0" dy="0">Checked</tspan></text><text x="757.0" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="757.0" dy="0">Every figure is checked</tspan><tspan x="757.0" dy="18.9">against the saved page.</tspan><tspan x="757.0" dy="18.9">If not there: left out.</tspan></text></svg>