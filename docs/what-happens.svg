<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520"><rect x="0.5" y="0.5" width="979" height="519" rx="14" fill="#ffffff" stroke="#e2e0d8"/><text x="490.0" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="490.0" dy="0.0">What happens when you run market-research</tspan></text><rect x="35.0" y="70" width="286" height="170" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="65.0" cy="102" r="16" fill="#f2c14e"/><text x="65.0" y="108" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="65.0" dy="0.0">1</tspan></text><text x="93.0" y="108" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="93.0" dy="0.0">You ask</tspan></text><text x="55.0" y="146" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="55.0" dy="0.0">For example: &quot;Research the</tspan><tspan x="55.0" dy="18.9">autographs market.&quot;</tspan></text><line x1="324.0" y1="155.0" x2="335.0" y2="155.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M332.0,147.0 L344.0,155.0 L332.0,163.0 Z" fill="#8fd1d5"/><rect x="347.0" y="70" width="286" height="170" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="377.0" cy="102" r="16" fill="#323748"/><text x="377.0" y="108" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="377.0" dy="0.0">2</tspan></text><text x="405.0" y="108" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="405.0" dy="0.0">A plan</tspan></text><text x="367.0" y="146" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="367.0" dy="0.0">Claude splits the research into 8</tspan><tspan x="367.0" dy="18.9">to 12 small jobs, each with a</tspan><tspan x="367.0" dy="18.9">clear list of what to find.</tspan></text><line x1="636.0" y1="155.0" x2="647.0" y2="155.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M644.0,147.0 L656.0,155.0 L644.0,163.0 Z" fill="#8fd1d5"/><rect x="659.0" y="70" width="286" height="170" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="689.0" cy="102" r="16" fill="#323748"/><text x="689.0" y="108" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="689.0" dy="0.0">3</tspan></text><text x="717.0" y="108" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="717.0" dy="0.0">Research</tspan></text><text x="679.0" y="146" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="679.0" dy="0.0">Helpers read the auction houses&#x27;</tspan><tspan x="679.0" dy="18.9">own pages and save every page</tspan><tspan x="679.0" dy="18.9">they use.</tspan></text><rect x="35.0" y="288" width="286" height="170" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="65.0" cy="320" r="16" fill="#f2c14e"/><text x="65.0" y="326" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="65.0" dy="0.0">4</tspan></text><text x="93.0" y="326" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="93.0" dy="0.0">Locked pages</tspan></text><text x="55.0" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="55.0" dy="0.0">Pages behind a login are read in</tspan><tspan x="55.0" dy="18.9">your own Chrome. If a site wants</tspan><tspan x="55.0" dy="18.9">you to sign in, Claude asks you.</tspan></text><line x1="324.0" y1="373.0" x2="335.0" y2="373.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M332.0,365.0 L344.0,373.0 L332.0,381.0 Z" fill="#8fd1d5"/><rect x="347.0" y="288" width="286" height="170" rx="12" fill="#f7f4e2" stroke="#d7d2bb"/><circle cx="377.0" cy="320" r="16" fill="#323748"/><text x="377.0" y="326" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="377.0" dy="0.0">5</tspan></text><text x="405.0" y="326" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#231f20" text-anchor="start"><tspan x="405.0" dy="0.0">Checked</tspan></text><text x="367.0" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="367.0" dy="0.0">Every price and every quote is</tspan><tspan x="367.0" dy="18.9">checked against the saved page.</tspan><tspan x="367.0" dy="18.9">Anything that is not there is</tspan><tspan x="367.0" dy="18.9">dropped.</tspan></text><line x1="636.0" y1="373.0" x2="647.0" y2="373.0" stroke="#8fd1d5" stroke-width="4" stroke-linecap="round"/><path d="M644.0,365.0 L656.0,373.0 L644.0,381.0 Z" fill="#8fd1d5"/><rect x="659.0" y="288" width="286" height="170" rx="12" fill="#323748"/><circle cx="689.0" cy="320" r="16" fill="#8fd1d5"/><text x="689.0" y="326" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="689.0" dy="0.0">6</tspan></text><text x="717.0" y="326" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="717.0" dy="0.0">Your document</tspan></text><text x="679.0" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="679.0" dy="0.0">Everything found, sorted into the</tspan><tspan x="679.0" dy="18.9">report&#x27;s 11 sections, as a Word</tspan><tspan x="679.0" dy="18.9">file and a Markdown file.</tspan></text><circle cx="370.0" cy="496" r="8" fill="#f2c14e"/><text x="386.0" y="501" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6f7280" text-anchor="start"><tspan x="386.0" dy="0.0">Steps where you take part</tspan></text><circle cx="560.0" cy="496" r="8" fill="#323748"/><text x="576.0" y="501" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6f7280" text-anchor="start"><tspan x="576.0" dy="0.0">Claude does these</tspan></text></svg>